<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Reimposta password — LiveMatch</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#fbfbfd;--surface:#fff;--surface2:#f4f4f8;--accent:#ff4d6d;--text:#1a1a24;--text2:#6c6c82;--border:rgba(0,0,0,0.1);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;}
  .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.06);}
  .logo{font-weight:700;font-size:26px;margin-bottom:6px;}
  .logo span{color:var(--accent);font-style:italic;}
  h1{font-size:20px;margin:8px 0 4px;}
  p{color:var(--text2);font-size:14px;line-height:1.5;}
  label{display:block;text-align:left;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 6px;}
  input{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--surface2);color:var(--text);outline:none;}
  input:focus{border-color:var(--accent);}
  button{width:100%;margin-top:18px;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:14px;}
  .err{color:var(--accent);}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Live<span>Match</span></div>

  <div id="loadingState"><p>Verifica del link in corso…</p></div>

  <div id="formState" class="hidden">
    <h1>Reimposta la password</h1>
    <p>Scegli una nuova password per il tuo account.</p>
    <label>Nuova password</label>
    <input type="password" id="pwd" placeholder="Minimo 6 caratteri"/>
    <label>Conferma password</label>
    <input type="password" id="pwd2" placeholder="Ripeti la password"/>
    <button id="btn" onclick="resetPwd()">Salva nuova password</button>
    <div id="msg" class="msg"></div>
  </div>

  <div id="doneState" class="hidden">
    <h1>✅ Fatto!</h1>
    <p>Password aggiornata. Torna nell'app <strong>LiveMatch</strong> e accedi con la nuova password.</p>
  </div>

  <div id="errorState" class="hidden">
    <h1>Link non valido</h1>
    <p>Questo link di reset è scaduto o non valido. Richiedine uno nuovo dall'app.</p>
  </div>
</div>

<script>
  const SB_URL = 'https://dmzozvidylvdaclzyeqk.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtem96dmlkeWx2ZGFjbHp5ZXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MzgyODQsImV4cCI6MjA5NTQxNDI4NH0.dmdHfeoXrPHCpFzOMxoVo8TtTuj1M9KRPnOUWRMn2sE';
  const sb = supabase.createClient(SB_URL, SB_ANON);
  let ready = false;
  function show(id){ ['loadingState','formState','doneState','errorState'].forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id)); }

  // Il link di reset porta qui con i token nell'URL: supabase-js li rileva e
  // crea una sessione di recupero (evento PASSWORD_RECOVERY).
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && !ready)) { ready = true; show('formState'); }
  });
  // Fallback: controlla la sessione dopo un attimo
  setTimeout(async () => {
    if (ready) return;
    const { data } = await sb.auth.getSession();
    if (data.session) { ready = true; show('formState'); } else { show('errorState'); }
  }, 2500);

  async function resetPwd() {
    const p1 = document.getElementById('pwd').value, p2 = document.getElementById('pwd2').value;
    const msg = document.getElementById('msg'), btn = document.getElementById('btn');
    msg.textContent = '';
    if (!p1 || p1.length < 6) { msg.className = 'msg err'; msg.textContent = 'Minimo 6 caratteri.'; return; }
    if (p1 !== p2) { msg.className = 'msg err'; msg.textContent = 'Le password non coincidono.'; return; }
    btn.disabled = true; btn.textContent = 'Salvataggio…';
    const { error } = await sb.auth.updateUser({ password: p1 });
    btn.disabled = false; btn.textContent = 'Salva nuova password';
    if (error) { msg.className = 'msg err'; msg.textContent = error.message || 'Errore, riprova.'; return; }
    show('doneState');
  }
</script>
</body>
</html>
